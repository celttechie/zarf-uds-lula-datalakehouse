# Istio AuthorizationPolicy for DoD IL4/IL5 Medallion Data Lakehouse
# Enforces Zero-Trust least-privilege network access control across mesh endpoints
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: datalakehouse-zero-trust-ingress
  namespace: datalakehouse
  labels:
    app.kubernetes.io/name: datalakehouse-authz
    app.kubernetes.io/part-of: il5-data-lakehouse-bundle
    uds.defenseunicorns.com/security-level: il5
spec:
  action: ALLOW
  rules:
    # 1. Allow intra-namespace Medallion pipeline communication (ETL -> MinIO & Postgres)
    - from:
        - source:
            principals:
              - "cluster.local/ns/datalakehouse/sa/*"
      to:
        - operation:
            ports: ["9000", "9001", "5432"]

    # 2. Allow ingress gateway traffic from UDS Core / Istio Ingress Gateway to MinIO S3 API & Console
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/uds-core/sa/uds-core-ingressgateway-service-account"
              - "cluster.local/ns/uds-core/sa/*"
      to:
        - operation:
            ports: ["9000", "9001"]

    # 3. Allow administrative, policy enforcement, and audit access from UDS Core (Pepr, Keycloak, Prometheus)
    - from:
        - source:
            principals:
              - "cluster.local/ns/pepr-system/sa/*"
              - "cluster.local/ns/uds-core-keycloak/sa/*"
              - "cluster.local/ns/uds-core-monitoring/sa/*"
      to:
        - operation:
            ports: ["9000", "9001", "5432"]
