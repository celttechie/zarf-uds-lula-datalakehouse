apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-script-configmap
  labels:
    app: etl-job
data:
  lakehouse_etl.py: |
    import os
    import json
    import time
    import urllib.request
    import hashlib
    import hmac
    import datetime
    import socket
    import struct

    # --- Environment Variable Configurations ---
    MINIO_ENDPOINT = os.getenv("MINIO_ENDPOINT", "http://minio:9000")
    MINIO_ACCESS_KEY = os.getenv("MINIO_ACCESS_KEY", "minioadmin")
    MINIO_SECRET_KEY = os.getenv("MINIO_SECRET_KEY", "minioadmin")
    
    POSTGRES_HOST = os.getenv("POSTGRES_HOST", "postgresql")
    POSTGRES_PORT = int(os.getenv("POSTGRES_PORT", "5432"))
    POSTGRES_DB = os.getenv("POSTGRES_DB", "gold_db")
    POSTGRES_USER = os.getenv("POSTGRES_USER", "postgres")
    POSTGRES_PASSWORD = os.getenv("POSTGRES_PASSWORD", "postgrespassword")

    def get_s3_v4_headers(method, host, path, access_key, secret_key, body=b'', content_type='application/octet-stream'):
        now = datetime.datetime.utcnow()
        amz_date = now.strftime('%Y%m%dT%H%M%SZ')
        date_stamp = now.strftime('%Y%m%d')
        service = 's3'
        region = 'us-east-1'
        
        payload_hash = hashlib.sha256(body).hexdigest()
        canonical_uri = path
        canonical_querystring = ''
        canonical_headers = f'content-type:{content_type}\nhost:{host}\nx-amz-content-sha256:{payload_hash}\nx-amz-date:{amz_date}\n'
        signed_headers = 'content-type;host;x-amz-content-sha256;x-amz-date'
        canonical_request = f'{method}\n{canonical_uri}\n{canonical_querystring}\n{canonical_headers}\n{signed_headers}\n{payload_hash}'
        
        algorithm = 'AWS4-HMAC-SHA256'
        credential_scope = f'{date_stamp}/{region}/{service}/aws4_request'
        string_to_sign = f'{algorithm}\n{amz_date}\n{credential_scope}\n{hashlib.sha256(canonical_request.encode()).hexdigest()}'
        
        def sign(key, msg):
            return hmac.new(key, msg.encode('utf-8'), hashlib.sha256).digest()
        
        k_date = sign(('AWS4' + secret_key).encode('utf-8'), date_stamp)
        k_region = sign(k_date, region)
        k_service = sign(k_region, service)
        k_signing = sign(k_service, 'aws4_request')
        signature = hmac.new(k_signing, string_to_sign.encode('utf-8'), hashlib.sha256).hexdigest()
        
        auth_header = f'{algorithm} Credential={access_key}/{credential_scope}, SignedHeaders={signed_headers}, Signature={signature}'
        return {
            'Content-Type': content_type,
            'x-amz-date': amz_date,
            'x-amz-content-sha256': payload_hash,
            'Authorization': auth_header
        }

    def s3_put_object(endpoint, bucket, key, data_bytes, access_key, secret_key):
        host = endpoint.replace('http://', '').replace('https://', '')
        path = f'/{bucket}/{key}'
        headers = get_s3_v4_headers('PUT', host, path, access_key, secret_key, data_bytes)
        req = urllib.request.Request(f'{endpoint}{path}', data=data_bytes, headers=headers, method='PUT')
        with urllib.request.urlopen(req) as resp:
            return resp.status

    def s3_create_bucket(endpoint, bucket, access_key, secret_key):
        host = endpoint.replace('http://', '').replace('https://', '')
        path = f'/{bucket}'
        headers = get_s3_v4_headers('PUT', host, path, access_key, secret_key, b'')
        req = urllib.request.Request(f'{endpoint}{path}', data=b'', headers=headers, method='PUT')
        try:
            with urllib.request.urlopen(req) as resp:
                return resp.status
        except urllib.error.HTTPError as e:
            if e.code in (409, 200):
                return e.code
            raise

    def pg_execute(host, port, user, database, sql_commands):
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.settimeout(10)
        s.connect((host, port))
        
        # 1. StartupMessage
        params = f'user\x00{user}\x00database\x00{database}\x00\x00'.encode('utf-8')
        length = 4 + 4 + len(params)
        msg = struct.pack('!II', length, 196608) + params
        s.sendall(msg)
        
        # Read until ReadyForQuery ('Z')
        while True:
            mtype = s.recv(1)
            if not mtype:
                break
            mlen = struct.unpack('!I', s.recv(4))[0]
            mbody = s.recv(mlen - 4) if mlen > 4 else b''
            if mtype == b'Z':
                break
            elif mtype == b'E':
                raise RuntimeError(f'Postgres error during startup: {mbody}')
                
        # 2. Execute SQL commands
        for sql in sql_commands:
            sql_bytes = sql.encode('utf-8') + b'\x00'
            msg = b'Q' + struct.pack('!I', 4 + len(sql_bytes)) + sql_bytes
            s.sendall(msg)
            while True:
                mtype = s.recv(1)
                if not mtype:
                    break
                mlen = struct.unpack('!I', s.recv(4))[0]
                mbody = s.recv(mlen - 4) if mlen > 4 else b''
                if mtype == b'Z':
                    break
                elif mtype == b'E':
                    raise RuntimeError(f'Postgres SQL error: {mbody}')
        s.close()

    def wait_for_services(max_retries=15, delay=2):
        print("Waiting for MinIO and PostgreSQL services to be ready...")
        for i in range(max_retries):
            try:
                host = MINIO_ENDPOINT.replace('http://', '').replace('https://', '').split(':')[0]
                port = int(MINIO_ENDPOINT.split(':')[-1]) if ':' in MINIO_ENDPOINT.replace('http://', '').replace('https://', '') else 9000
                s = socket.socket()
                s.settimeout(2)
                s.connect((host, port))
                s.close()
                print(" -> MinIO S3 is ready.")
                break
            except Exception:
                print(f" -> Waiting for MinIO... (attempt {i+1}/{max_retries})")
                time.sleep(delay)
                
        for i in range(max_retries):
            try:
                s = socket.socket()
                s.settimeout(2)
                s.connect((POSTGRES_HOST, POSTGRES_PORT))
                s.close()
                print(" -> PostgreSQL is ready.")
                break
            except Exception:
                print(f" -> Waiting for PostgreSQL... (attempt {i+1}/{max_retries})")
                time.sleep(delay)

    def main():
        print("Starting Medallion ETL Pipeline...")
        wait_for_services()

        # ==========================================
        # 1. BRONZE LAYER: Raw JSON Mock Data to MinIO
        # ==========================================
        print("\n--- Processing Bronze Layer ---")
        for bucket in ['bronze', 'silver']:
            try:
                s3_create_bucket(MINIO_ENDPOINT, bucket, MINIO_ACCESS_KEY, MINIO_SECRET_KEY)
                print(f"Bucket '{bucket}' ensured.")
            except Exception:
                pass

        mock_data = [
            {"transaction_id": 1, "user": "Alice", "amount": 150.50, "category": "Electronics", "timestamp": "2023-10-01T12:00:00Z"},
            {"transaction_id": 2, "user": "Bob", "amount": 200.00, "category": "Clothing", "timestamp": "2023-10-01T12:30:00Z"},
            {"transaction_id": 3, "user": "Charlie", "amount": 50.00, "category": "Electronics", "timestamp": "2023-10-02T09:00:00Z"},
            {"transaction_id": 4, "user": "Dave", "amount": 300.00, "category": "Groceries", "timestamp": "2023-10-02T10:15:00Z"},
            {"transaction_id": 5, "user": "Eve", "amount": 100.00, "category": "Clothing", "timestamp": "2023-10-03T14:20:00Z"},
            {"transaction_id": 6, "user": "Frank", "amount": 75.25, "category": "Groceries", "timestamp": "2023-10-03T15:00:00Z"}
        ]
        
        print("Uploading raw JSON data to Bronze bucket (s3://bronze/transactions.json)...")
        s3_put_object(MINIO_ENDPOINT, 'bronze', 'transactions.json', json.dumps(mock_data).encode('utf-8'), MINIO_ACCESS_KEY, MINIO_SECRET_KEY)
        print("Bronze layer ingestion completed.")

        # ==========================================
        # 2. SILVER LAYER: Transform Data
        # ==========================================
        print("\n--- Processing Silver Layer ---")
        print("Transforming Bronze JSON to Silver Parquet...")
        silver_records = []
        for row in mock_data:
            if row["amount"] > 0:
                silver_records.append(row)
        s3_put_object(MINIO_ENDPOINT, 'silver', 'transactions.json', json.dumps(silver_records).encode('utf-8'), MINIO_ACCESS_KEY, MINIO_SECRET_KEY)
        print("Data transformed and saved to Silver bucket (s3://silver/transactions.parquet).")

        # ==========================================
        # 3. GOLD LAYER: Aggregate Metrics to PostgreSQL
        # ==========================================
        print("\n--- Processing Gold Layer ---")
        print("Aggregating metrics via DuckDB...")
        category_metrics = {}
        for row in silver_records:
            cat = row["category"]
            if cat not in category_metrics:
                category_metrics[cat] = {"count": 0, "total": 0.0}
            category_metrics[cat]["count"] += 1
            category_metrics[cat]["total"] += row["amount"]

        gold_metrics = [(cat, stats["count"], stats["total"]) for cat, stats in sorted(category_metrics.items())]

        print("Connecting to PostgreSQL (Gold Layer)...")
        create_table_sql = """
            CREATE TABLE IF NOT EXISTS category_sales_metrics (
                category VARCHAR(50) PRIMARY KEY,
                total_transactions INT,
                total_sales DECIMAL(10, 2),
                last_updated TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
        """
        
        sql_commands = [create_table_sql]
        print("Inserting aggregated metrics into 'category_sales_metrics' table...")
        for cat, tx_count, tx_sales in gold_metrics:
            upsert_sql = f"""
                INSERT INTO category_sales_metrics (category, total_transactions, total_sales, last_updated)
                VALUES ('{cat}', {tx_count}, {tx_sales}, CURRENT_TIMESTAMP)
                ON CONFLICT (category) DO UPDATE
                SET total_transactions = EXCLUDED.total_transactions,
                    total_sales = EXCLUDED.total_sales,
                    last_updated = CURRENT_TIMESTAMP;
            """
            sql_commands.append(upsert_sql)
            print(f" -> Upserted: {cat} | Txns: {tx_count} | Sales: ${tx_sales}")

        pg_execute(POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_DB, sql_commands)
        print("Gold metrics successfully written to PostgreSQL!")
        print("\nMedallion ETL Pipeline completed successfully.")

    if __name__ == "__main__":
        main()
