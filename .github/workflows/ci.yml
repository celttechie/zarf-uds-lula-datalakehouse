name: CI & Compliance Validation Workflow

on:
  push:
    branches: [ main, phase* ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: OpenTofu, Helm, Python & Go Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu-version: '1.8.2'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Validate OpenTofu Syntax & Format
        run: |
          for env in terraform/environments/*; do
            if [ -d "$env" ]; then
              echo "==> Validating $env with OpenTofu"
              (cd "$env" && tofu fmt -check && tofu init -backend=false && tofu validate)
            fi
          done

      - name: Lint Helm Chart
        run: |
          helm lint k8s/charts/datalakehouse

      - name: Install Python Dependencies & Run Tests
        run: |
          pip install -r requirements.txt
          pip install pyyaml
          python -m unittest discover -s tests

      - name: Build Go Compliance Exporter CLI
        run: |
          make go-build
          test -f ./bin/compliance_exporter
