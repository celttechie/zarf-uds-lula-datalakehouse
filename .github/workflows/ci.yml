name: CI & Compliance Validation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Terraform, Helm, Zarf & Go Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Validate Terraform Syntax & Format
        run: |
          cd terraform/environments/dev
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Lint Helm Chart
        run: |
          helm lint k8s/charts/datalakehouse

      - name: Build Go Compliance Exporter CLI
        run: |
          make go-build
          ./bin/compliance_exporter --help || true
