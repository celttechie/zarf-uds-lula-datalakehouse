name: CI & Compliance Validation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Terraform, Helm, Python & Go Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Validate Terraform Syntax & Format
        run: |
          for env in terraform/environments/*; do
            if [ -d "$env" ]; then
              echo "==> Validating $env"
              (cd "$env" && terraform fmt -check && terraform init -backend=false && terraform validate)
            fi
          done

      - name: Lint Helm Chart
        run: |
          helm lint k8s/charts/datalakehouse

      - name: Install Python Dependencies & Run Tests
        run: |
          pip install -r requirements.txt
          pip install pyyaml
          python -m unittest discover -s tests

      - name: Build Go Compliance Exporter CLI
        run: |
          make go-build
          test -f ./bin/compliance_exporter
