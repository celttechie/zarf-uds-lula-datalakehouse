#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.local
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [libvirt, kvm, sudo]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
  - name: brian
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [libvirt, kvm, sudo]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

%{ if host_private_key != "" ~}
ssh_keys:
  ed25519_private: |
    ${indent(4, host_private_key)}
  ed25519_public: ${host_public_key}
%{ endif ~}

bootcmd:
  - systemctl enable --now qemu-guest-agent || true

package_update: false
package_upgrade: false

packages:
  - curl
  - wget
  - git
  - jq
  - qemu-guest-agent
  - htop
  - net-tools
  - bridge-utils
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - python3
  - python3-pip

write_files:
  - path: /etc/apparmor.d/local/abstractions/libvirt-qemu
    permissions: '0644'
    content: |
      /var/lib/libvirt/images/** rwk,

runcmd:
  - systemctl enable --now qemu-guest-agent libvirtd
  - mkdir -p /var/lib/libvirt/images
  - chown libvirt-qemu:kvm /var/lib/libvirt/images
  - chmod 2775 /var/lib/libvirt/images
  - sh -c 'systemctl reload apparmor || true'
  - sh -c 'virsh pool-define-as default dir --target /var/lib/libvirt/images || true'
  - sh -c 'virsh pool-autostart default || true'
  - sh -c 'virsh pool-start default || true'
  - sh -c 'virsh net-autostart default || true'
  - sh -c 'virsh net-start default || true'
