component-definition:
  uuid: 7b1d9888-5524-44f0-adf3-2606979d46e0
  metadata:
    title: "DoD IL5 Medallion Data Lakehouse Security Component Definition"
    last-modified: "2026-08-29T17:00:00Z"
    version: "1.0.0"
    oscal-version: "1.1.2"
    parties:
      - uuid: 3f566110-a09e-45e9-909c-18f0a5e712b0
        type: organization
        name: "Defense Unicorns & Lakehouse Engineering Team"
  components:
    - uuid: d46ebb9f-e6a1-4a76-9e9e-448a4455fe05
      type: software
      title: "data-lakehouse-medallion"
      description: "Air-gapped Medallion Data Lakehouse with MinIO S3, DuckDB Parquet Engine, and PostgreSQL Gold Warehouse."
      purpose: "Ingestion, transformation, and analytical serving of mission-critical telemetry under DoD IL5 requirements."
      control-implementations:
        - uuid: 0434b7a3-6e40-494e-81c2-a8907704f3ce
          source: "https://github.com/usnistgov/oscal-content/blob/master/nist.gov/SP800-53/rev5/json/NIST_SP-800-53_rev5_catalog.json"
          description: "NIST SP 800-53 Rev 5 Controls for DoD Impact Level 5 Continuous Authorization"
          implemented-requirements:
            - uuid: 9c70e881-5b0a-4cc9-9655-f4c036c39baa
              control-id: ac-3
              description: "Access Enforcement - Containers must enforce least privilege by running as non-root with dropped Linux capabilities."
              links:
                - href: "#ac-3-validation"
                  rel: "lula"

            - uuid: 27453a7f-cf09-4416-93ef-851884370cb7
              control-id: ac-4
              description: "Information Flow Enforcement - Intra-cluster traffic must be restricted and authenticated via Istio Service Mesh in STRICT mTLS mode."
              links:
                - href: "#ac-4-validation"
                  rel: "lula"

            - uuid: dc3e594e-ffcf-4319-8265-e8bddbece419
              control-id: ia-2
              description: "Identification and Authentication - Workload identities must use SPIFFE cryptographically verifiable x509 certificates."

            - uuid: 3975cec1-5e06-45d5-ad8f-fd57a8501235
              control-id: sc-8
              description: "Transmission Confidentiality and Integrity - Data in transit across pods must use TLS 1.3 wire encryption."
              links:
                - href: "#sc-8-validation"
                  rel: "lula"

            - uuid: 1c88a4e9-07a5-4300-999d-7d5279229710
              control-id: sc-13
              description: "Cryptographic Protection - Columnar data files must be protected with modern checksums and Snappy compression."

            - uuid: 7e36f396-03c2-466d-b9ff-1934c34fa4ae
              control-id: sc-28
              description: "Protection of Information at Rest - Object storage and database volumes must be isolated on dedicated filesystems."

            - uuid: 970b81fd-28ec-4eed-9004-347741e97860
              control-id: si-4
              description: "Information System Monitoring - Pods and database metrics must be observable via structured logs and health endpoints."
  back-matter:
    resources:
      - uuid: 4d0fe157-37fb-414e-a87f-8907a8751926
        title: "ac-3 non-root execution policy"
        rlinks:
          - href: "#ac-3-validation"
            media-type: "application/lula"
        remarks: |
          domain:
            type: kubernetes
            kubernetes-spec:
              resources:
                - group: ""
                  version: v1
                  resource: pods
                  namespaces: [datalakehouse]
          provider:
            type: opa
            opa-spec:
              rego: |
                package validate
                import rego.v1
                default validate = true
